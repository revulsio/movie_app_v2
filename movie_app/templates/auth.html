{% extends 'base.html' %}{% block c %}
<div class="card card-body mx-auto" style="max-width:380px">
  <h3>{{ 'Нэвтрэх' if mode=='login' else 'Бүртгүүлэх' }}</h3>
  <form method="post">
    <input class="form-control mb-2" name="username" placeholder="Хэрэглэгчийн нэр" required>
    <input class="form-control mb-3" type="password" name="password" placeholder="Нууц үг" required>
    <button class="btn btn-primary w-100">{{ 'Нэвтрэх' if mode=='login' else 'Бүртгүүлэх' }}</button>
  </form>
  <hr>
  {% if mode=='login' %}
    <a class="btn btn-outline-primary w-100 mb-2" href="{{ url_for('register') }}">Бүртгүүлэх</a>
    <a class="btn btn-outline-secondary w-100" href="{{ url_for('movies') }}">Зочноор орох</a>
  {% else %}
    <a class="btn btn-outline-secondary w-100" href="{{ url_for('login') }}">Нэвтрэх хуудас руу буцах</a>
  {% endif %}
</div>{% endblock %}
